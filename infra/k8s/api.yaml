# the control plane api as blue/green: two deployments, one service that
# selects a color. infra/k8s/promote.sh flips the selector after the golden
# suite passes. workers are not blue/green (see docs/runbooks/promote.md).
apiVersion: v1
kind: Service
metadata: { name: api }
spec:
  selector: { app: api, color: blue }
  ports: [{ port: 80, targetPort: 4000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-blue, labels: { app: api, color: blue } }
spec:
  replicas: 2
  selector: { matchLabels: { app: api, color: blue } }
  template:
    metadata: { labels: { app: api, color: blue } }
    spec:
      containers:
        - name: api
          image: ghcr.io/modi-meet/oj-api:v0.0.0
          ports: [{ containerPort: 4000 }]
          envFrom: [{ secretRef: { name: oj-env } }]
          readinessProbe: { httpGet: { path: /health, port: 4000 }, periodSeconds: 5 }
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-green, labels: { app: api, color: green } }
spec:
  replicas: 2
  selector: { matchLabels: { app: api, color: green } }
  template:
    metadata: { labels: { app: api, color: green } }
    spec:
      containers:
        - name: api
          image: ghcr.io/modi-meet/oj-api:v0.0.0
          ports: [{ containerPort: 4000 }]
          envFrom: [{ secretRef: { name: oj-env } }]
          readinessProbe: { httpGet: { path: /health, port: 4000 }, periodSeconds: 5 }
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
