# the gateway in front of the control plane. /api and /ws go to the api; /api/ai
# goes to the mentor — the api never learns the mentor exists (hld §8.8).
server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ai/ { proxy_pass http://ai-mentor:4002; proxy_buffering off; proxy_read_timeout 120s; }
  location /api/   { proxy_pass http://api:4000; proxy_buffering off; proxy_read_timeout 130s; }
  location /ws/    { proxy_pass http://api:4000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 1h; }
  location / { try_files $uri /index.html; }
}
